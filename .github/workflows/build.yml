name: Build

on:
  push:
    branches: [main, feature/typescript-migration]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  make:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/foodguide/package-lock.json

      - name: Install Linux build and display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools xvfb

      - name: Install dependencies
        run: npm ci

      - name: Install Food Guide dependencies
        run: npm ci --ignore-scripts --prefix app/foodguide

      - name: Configure Linux Electron sandbox
        if: runner.os == 'Linux'
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Validate the app and embedded Food Guide
        run: npm run check

      - name: Audit dependencies
        run: npm run audit

      - name: Smoke-test Electron on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron

      - name: Smoke-test Electron on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:electron

      - name: Build distributables
        run: npm run make

      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil verify out/make/dmg/*/*.dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: make-${{ matrix.os }}
          path: out/make/**/*
          if-no-files-found: error
          retention-days: 3
