name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  make:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distributables
        run: npm run make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: make-${{ matrix.os }}
          path: out/make/**/*
