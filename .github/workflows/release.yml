name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v1.2.6)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/foodguide/package-lock.json

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node -e "const assert = require('node:assert/strict'); assert.equal(process.env.RELEASE_TAG, 'v' + require('./package.json').version);"

      - name: Install Linux build and display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools xvfb

      - name: Install dependencies
        run: npm ci

      - name: Install Food Guide dependencies
        run: npm ci --ignore-scripts --prefix app/foodguide

      - name: Configure Linux Electron sandbox
        if: runner.os == 'Linux'
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Validate the app and embedded Food Guide
        run: npm run check

      - name: Smoke-test Electron on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron --if-present

      - name: Smoke-test Electron on Windows
        if: runner.os == 'Windows'
        run: npm run test:electron --if-present

      - name: Build release artifacts
        run: npm run make

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: out/make/**/*
          if-no-files-found: error
          retention-days: 3

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Prepare release files and SHA256 checksums
        run: |
          mkdir release-files
          while IFS= read -r -d '' file; do
            destination="release-files/$(basename "$file")"
            if [[ -e "$destination" ]]; then
              echo "::error::Duplicate release filename: $destination"
              exit 1
            fi
            cp -- "$file" "$destination"
          done < <(find release-assets -type f -print0)
          cd release-files
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          cp ../SHA256SUMS.txt .

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-files/*
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
